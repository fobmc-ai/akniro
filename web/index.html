<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>织能工程控制中心</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#10151b; color:#e7edf4; }
    body { margin:0; } header { height:62px; display:flex; align-items:center; padding:0 28px; border-bottom:1px solid #2a3440; }
    header h1 { font-size:18px; margin:0; } header span { color:#8fa2b5; margin-left:14px; font-size:13px; }
    main { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 63px); } aside { border-right:1px solid #2a3440; padding:20px; }
    section { padding:28px 34px; max-width:1100px; } .tree { color:#b9c8d6; line-height:2; font-size:14px; }
    .tree .root { color:#fff; font-weight:700; } .tree .folder { margin-left:18px; } .tree .folder::before { content:'▸ '; color:#5fa8d3; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:24px 0; }
    .card { background:#19222c; border:1px solid #2b3946; border-radius:10px; padding:16px; } .card label { color:#8fa2b5; font-size:12px; }
    .card strong { display:block; font-size:26px; margin-top:8px; } .panel { background:#151d25; border:1px solid #2b3946; border-radius:10px; padding:18px; margin-top:18px; }
    table { width:100%; border-collapse:collapse; font-size:13px; } th,td { text-align:left; padding:11px 8px; border-bottom:1px solid #293540; } th { color:#8fa2b5; }
    .status { color:#71d7a4; } .muted { color:#8fa2b5; } .error { color:#ff8d8d; } .badge { border:1px solid #a87835; color:#f2c477; border-radius:12px; padding:3px 8px; font-size:11px; } .placeholder { color:#f2c477; }
    form { display:flex; gap:8px; flex-wrap:wrap; } input,select,button { background:#10151b; border:1px solid #405363; color:#e7edf4; border-radius:6px; padding:9px 10px; } button { background:#286c96; cursor:pointer; } button:hover { background:#368ab9; }
    nav { margin-top:24px; display:grid; gap:6px; } nav button { text-align:left; background:transparent; border-color:transparent; color:#b9c8d6; } nav button.active, nav button:hover { background:#1e3a4e; color:#fff; }
    .hero { background:linear-gradient(120deg,#173b50,#19222c); border:1px solid #3c7390; border-radius:14px; padding:24px; } .hero h2 { margin:0 0 8px; font-size:24px; } .hero p { margin:0; color:#b9c8d6; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; } .metric { color:#71d7a4; } .warning { color:#f2c477; } .progress { height:8px; background:#26333e; border-radius:5px; overflow:hidden; margin-top:10px; } .progress i { display:block; height:100%; background:#43b883; }
  </style>
</head>
<body>
  <header><h1>织能工程控制中心</h1><span>Project Control Center · PM-0</span></header>
  <main><aside><div id="tree" class="tree"><div class="root">📁 当前项目</div><p class="muted">加载目录…</p></div><nav id="nav" hidden><button data-view="overview">总览</button><button data-view="backlog">实施路线</button><button data-view="requirement">需求</button><button data-view="work_item">任务</button><button data-view="issue">问题与 CAPA</button><button data-view="design_goal">设计目标</button><button data-view="test_case">测试库</button><button data-view="tool_validation">工具验证</button><button data-view="artifact">工程资产</button><button data-view="parameter_snapshot">参数快照</button><button data-view="knowledge">知识库</button><button data-view="release">发布维护</button><button data-view="audit">审计与备份</button></nav></aside>
    <section><div id="content"><p class="muted">正在加载项目…</p></div></section></main>
  <script>
    const el = document.getElementById('content');
    async function load() {
      try {
        const response = await fetch('/api/projects'); const data = await response.json();
        if (!data.projects.length) { el.innerHTML = `<h2>项目总览</h2><p class="muted">还没有项目，先创建 PM 项目。</p><div class="panel"><form id="project-form"><input name="projectId" placeholder="项目 ID，如 P-001" required><input name="name" placeholder="项目名称" required><input name="tenantId" placeholder="租户 ID" value="T-001" required><input name="ownerId" placeholder="Owner ID" value="U-001" required><button>创建项目</button></form><p id="form-message" class="muted"></p></div>`; document.getElementById('project-form').onsubmit = createProject; return; }
        const project = await (await fetch('/api/projects/' + encodeURIComponent(data.projects[0].id))).json();
        const tree = await (await fetch('/api/projects/' + encodeURIComponent(project.id) + '/tree')).json();
        document.getElementById('tree').innerHTML = '<div class="root">📁 ' + project.name + '</div>' + renderTree(tree.tree);
        const entities = project.entities || []; const count = type => entities.filter(x => x.entity_type === type).length;
        el.innerHTML = `<h2>${project.name}</h2><p class="muted">${project.id} · ${project.kind} · revision ${project.revision}</p>
          <div class="cards"><div class="card"><label>需求</label><strong>${count('requirement')}</strong></div><div class="card"><label>任务</label><strong>${count('work_item')}</strong></div><div class="card"><label>问题</label><strong>${count('issue')}</strong></div><div class="card"><label>状态</label><strong class="status">${project.status}</strong></div></div>
          <div class="panel"><h3>新建对象</h3><form id="entity-form"><select name="type"><option value="requirement">需求</option><option value="work_item">任务</option><option value="issue">问题</option></select><input name="id" placeholder="对象 ID" required><input name="title" placeholder="标题" required><input name="ownerId" placeholder="Owner ID" value="U-001" required><button>创建</button></form><p id="form-message" class="muted"></p></div>
          <div class="panel"><h3>项目对象</h3><table><thead><tr><th>ID</th><th>类型</th><th>标题</th><th>状态</th><th>Revision</th><th>操作</th></tr></thead><tbody>${entities.map(x => `<tr><td>${x.id}</td><td>${x.entity_type}</td><td>${x.title}</td><td class="status">${x.status}</td><td>${x.revision}</td><td>${nextState(x) ? `<button data-id="${x.id}" data-revision="${x.revision}" data-target="${nextState(x)}" class="transition">→ ${nextState(x)}</button>` : '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
        document.getElementById('entity-form').onsubmit = event => createEntity(event, project);
        document.querySelectorAll('.transition').forEach(button => button.onclick = () => transition(button.dataset.id, button.dataset.target, Number(button.dataset.revision)));
        document.getElementById('nav').hidden = false; document.querySelectorAll('#nav button').forEach(button => button.onclick = () => showView(button.dataset.view, project));
      } catch (e) { el.innerHTML = `<p class="error">无法连接 PM 服务：${e.message}</p>`; }
    }
    function nextState(entity) { const map = { requirement:{DRAFT:'READY',READY:'IMPLEMENTING',IMPLEMENTING:'VERIFIED',VERIFIED:'ACCEPTED',ACCEPTED:'CLOSED'}, work_item:{PLANNED:'IN_PROGRESS',IN_PROGRESS:'REVIEW',REVIEW:'TEST',TEST:'DONE'}, issue:{OPEN:'REPRODUCED',REPRODUCED:'ROOT_CAUSED',ROOT_CAUSED:'FIXED',FIXED:'REGRESSION',REGRESSION:'CLOSED'}, design_goal:{DRAFT:'READY',READY:'IMPLEMENTING',IMPLEMENTING:'VERIFIED',VERIFIED:'ACCEPTED',ACCEPTED:'CLOSED'}, test_case:{DRAFT:'READY',READY:'RUNNING',RUNNING:'PASSED'}, test_plan:{DRAFT:'READY',READY:'RUNNING',RUNNING:'COMPLETED'}, test_run:{QUEUED:'RUNNING',RUNNING:'PASSED'}, evidence:{DRAFT:'VALIDATED',VALIDATED:'ARCHIVED'}, tool_validation:{DRAFT:'RUNNING',RUNNING:'VALIDATED'}, artifact:{DRAFT:'BUILT',BUILT:'TESTED',TESTED:'APPROVED'}, parameter_snapshot:{DRAFT:'VALIDATED',VALIDATED:'APPROVED',APPROVED:'APPLIED'}, knowledge:{DRAFT:'REVIEW',REVIEW:'VALIDATED',VALIDATED:'APPROVED'}, release:{DRAFT:'CANDIDATE',CANDIDATE:'VALIDATED',VALIDATED:'APPROVED',APPROVED:'RELEASED'}, maintenance:{OPEN:'IN_PROGRESS',IN_PROGRESS:'COMPLETED',COMPLETED:'CLOSED'} }; return map[entity.entity_type]?.[entity.status]; }
    function renderTree(nodes, depth=0) { return nodes.map(node => '<div class="folder" style="margin-left:' + (depth*18+18) + 'px">' + node.name + '</div>' + renderTree(node.children || [], depth+1)).join(''); }
    async function showView(view, project) {
      document.querySelectorAll('#nav button').forEach(button => button.classList.toggle('active', button.dataset.view === view));
      if (view === 'overview') { load(); return; }
      if (view === 'backlog') { const items = await (await fetch('/api/projects/' + project.id + '/backlog')).then(response => response.json()).then(data => data.items); const counts = items.reduce((a, x) => (a[x.status] = (a[x.status] || 0) + 1, a), {}); el.innerHTML = `<h2>总纲实施路线</h2><p class="muted">${project.name} · ${items.length} 个工作包 · 结构数据可先占位，真实实现和证据后续回填</p><div class="cards"><div class="card"><label>全部</label><strong>${items.length}</strong></div><div class="card"><label>已冻结契约</label><strong>${counts.CONTRACTED || 0}</strong></div><div class="card"><label>开发中</label><strong>${counts.IMPLEMENTING || 0}</strong></div><div class="card"><label>Placeholder</label><strong class="placeholder">${items.filter(x => x.placeholder).length}</strong></div></div><div class="panel"><h3>工作包与验收门禁</h3><table><thead><tr><th>ID</th><th>领域</th><th>工作包</th><th>状态</th><th>目标版本</th><th>验收标准</th><th>依赖</th></tr></thead><tbody>${items.map(x => `<tr><td>${x.id}</td><td>${x.area}</td><td>${x.title}</td><td>${x.placeholder ? '<span class="badge">PLACEHOLDER</span>' : '<span class="status">' + x.status + '</span>'}</td><td>${x.target_release}</td><td>${x.acceptance_criteria.join('；')}</td><td>${x.dependencies.join(', ') || '—'}</td></tr>`).join('')}</tbody></table></div>`; return; }
      if (view === 'audit') { const data = await (await fetch('/api/projects/' + project.id + '/audit')).json(); el.innerHTML = `<h2>审计与备份</h2><p class="muted">所有关键变更保留操作人、目标、结果和时间。</p><div class="panel"><button onclick="backupProject('${project.id}')">创建项目备份</button></div><div class="panel"><table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>目标</th><th>结果</th></tr></thead><tbody>${data.audit.map(x => `<tr><td>${x.occurred_at}</td><td>${x.actor_id}</td><td>${x.action}</td><td>${x.target_id}</td><td class="status">${x.outcome}</td></tr>`).join('')}</tbody></table></div>`; return; }
      const entities = await (await fetch('/api/projects/' + project.id + '/entities?type=' + view)).then(response => response.json()).then(data => data.entities);
      const labels = {requirement:'需求', work_item:'开发任务', issue:'问题与 CAPA', design_goal:'设计目标', test_case:'测试库', test_plan:'测试计划', tool_validation:'PLC/HMI/工具验证', artifact:'工程资产与固件', parameter_snapshot:'参数快照与同步', knowledge:'知识库', release:'发布与维护', maintenance:'维护记录'};
      el.innerHTML = `<h2>${labels[view]}</h2><p class="muted">${project.name} · ${entities.length} 项</p><div class="panel"><h3>新建${labels[view]}</h3><form id="view-form"><input name="id" placeholder="对象 ID" required><input name="title" placeholder="标题" required><input name="ownerId" placeholder="Owner ID" value="U-001" required><button>创建</button></form><p id="form-message" class="muted"></p></div><div class="panel"><table><thead><tr><th>ID</th><th>标题</th><th>状态</th><th>Revision</th><th>操作</th></tr></thead><tbody>${entities.map(x => `<tr><td>${x.id}</td><td>${x.title}</td><td class="status">${x.status}</td><td>${x.revision}</td><td>${nextState(x) ? `<button class="transition" data-id="${x.id}" data-revision="${x.revision}" data-target="${nextState(x)}">→ ${nextState(x)}</button>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('view-form').onsubmit = event => createEntity(event, project, view);
      if (view === 'test_case' && entities.length) { el.innerHTML += `<div class="panel"><h3>执行测试并生成证据</h3><form id="test-run-form"><select name="testCaseId">${entities.map(x => `<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select><input name="runId" placeholder="Test Run ID" required><input name="evidenceId" placeholder="Evidence ID" required><input name="releaseId" placeholder="Release ID（可选）"><select name="passed"><option value="true">通过</option><option value="false">失败</option></select><button>执行测试</button></form><p id="test-run-message" class="muted"></p></div>`; document.getElementById('test-run-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/projects/' + project.id + '/test-runs/execute', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:project.tenant_id,actorId:'U-001',testCaseId:data.testCaseId,runId:data.runId,evidenceId:data.evidenceId,releaseId:data.releaseId || undefined,passed:data.passed === 'true'})}); const result = await response.json(); document.getElementById('test-run-message').textContent = response.ok ? `Test Run：${result.testRun.status}；Evidence：${result.evidence ? result.evidence.status : '未生成（失败）'}` : '执行失败：' + (result.message || result.error || '请求错误'); }; }
      if (view === 'parameter_snapshot' && entities.some(x => x.status === 'APPROVED')) { const approved = entities.filter(x => x.status === 'APPROVED'); el.innerHTML += `<div class="panel"><h3>安全应用参数</h3><form id="parameter-apply-form"><select name="snapshotId">${approved.map(x => `<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select><input name="approvalId" placeholder="人工审批 ID" required><input name="syncId" placeholder="同步 ID" required><button>进入 PUSH_APPROVED</button></form><p id="parameter-apply-message" class="muted"></p></div>`; document.getElementById('parameter-apply-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/entities/' + data.snapshotId + '/apply', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:project.tenant_id,actorId:'U-001',approvalId:data.approvalId,syncId:data.syncId})}); document.getElementById('parameter-apply-message').textContent = response.ok ? '参数已进入 PUSH_APPROVED 队列并应用。' : '应用失败：' + (await response.json()).message; if (response.ok) showView('parameter_snapshot', project); }; }
      if (view === 'issue' && entities.length) { el.innerHTML += `<div class="panel"><h3>CAPA 根因与关闭条件</h3><form id="capa-form"><select name="issueId">${entities.map(x => `<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select><input name="rootCause" placeholder="根因"><input name="fixVersion" placeholder="修复版本"><input name="regressionTestIds" placeholder="回归测试 ID，逗号分隔"><input name="closureCriteria" placeholder="关闭标准，逗号分隔"><button>保存 CAPA</button></form><p id="capa-message" class="muted"></p></div>`; document.getElementById('capa-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const issue = entities.find(x => x.id === data.issueId); const payload = {...issue.payload, rootCause:data.rootCause, fixVersion:data.fixVersion, regressionTestIds:data.regressionTestIds.split(',').map(x => x.trim()).filter(Boolean), closureCriteria:data.closureCriteria.split(',').map(x => x.trim()).filter(Boolean)}; const response = await fetch('/api/entities/' + issue.id + '/payload', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:project.tenant_id,actorId:'U-001',expectedRevision:issue.revision,payload})}); document.getElementById('capa-message').textContent = response.ok ? 'CAPA 已保存，可按状态机继续关闭。' : '保存失败，请重新读取 Revision'; if (response.ok) showView('issue', project); }; }
      if (view === 'release' && entities.length) { el.innerHTML += `<div class="panel"><h3>Release 组合与人工审批</h3><form id="release-form"><select name="releaseId">${entities.map(x => `<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select><input name="approvalId" placeholder="人工审批 ID"><input name="artifactIds" placeholder="纳入资产 ID，逗号分隔"><button>保存 Release Gate 输入</button></form><p id="release-message" class="muted"></p></div>`; document.getElementById('release-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const release = entities.find(x => x.id === data.releaseId); const payload = {...release.payload, approvalId:data.approvalId, artifactIds:data.artifactIds.split(',').map(x => x.trim()).filter(Boolean)}; const response = await fetch('/api/entities/' + release.id + '/payload', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:project.tenant_id,actorId:'U-001',expectedRevision:release.revision,payload})}); document.getElementById('release-message').textContent = response.ok ? 'Release Gate 输入已保存，请继续按状态机推进。' : '保存失败，请重新读取 Revision'; if (response.ok) showView('release', project); }; }
      if (view === 'parameter_snapshot') { el.innerHTML += `<div class="panel"><h3>录入参数快照</h3><form id="parameter-form"><input name="id" placeholder="快照 ID" required><input name="title" placeholder="快照标题" required><textarea name="payload" rows="7" style="width:100%;font-family:monospace">{"speed":100,"timeoutMs":500}</textarea><button>保存参数快照</button></form><p id="parameter-message" class="muted"></p></div>`; document.getElementById('parameter-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); let payload; try { payload = JSON.parse(data.payload); } catch (_) { document.getElementById('parameter-message').textContent = 'JSON 格式错误'; return; } const response = await fetch('/api/projects/' + project.id + '/entities', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:data.id,type:'parameter_snapshot',title:data.title,ownerId:'U-001',tenantId:project.tenant_id,actorId:'U-001',payload})}); document.getElementById('parameter-message').textContent = response.ok ? '参数快照已保存，可继续验证和审批。' : '保存失败'; if (response.ok) showView('parameter_snapshot', project); }; }
      document.querySelectorAll('.transition').forEach(button => button.onclick = () => transition(button.dataset.id, button.dataset.target, Number(button.dataset.revision), () => showView(view, project)));
    }
    async function createProject(event) { event.preventDefault(); const form = new FormData(event.target); const payload = Object.fromEntries(form); const response = await fetch('/api/projects', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); document.getElementById('form-message').textContent = response.ok ? '项目已创建，正在刷新…' : '创建失败'; if (response.ok) load(); }
    async function createEntity(event, project, type) { event.preventDefault(); const form = new FormData(event.target); const payload = Object.fromEntries(form); payload.type = type || 'requirement'; payload.tenantId = project.tenant_id; payload.actorId = 'U-001'; const response = await fetch('/api/projects/' + project.id + '/entities', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); document.getElementById('form-message').textContent = response.ok ? '对象已创建，正在刷新…' : '创建失败'; if (response.ok) type ? showView(type, project) : load(); }
    async function transition(id, target, expectedRevision, callback) { const response = await fetch('/api/entities/' + id + '/transition', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target, tenantId:'T-001', actorId:'U-001', expectedRevision})}); if (!response.ok) alert('状态变更失败，请重新读取页面'); callback ? callback() : load(); }
    async function backupProject(projectId) { const response = await fetch('/api/projects/' + projectId + '/backup', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:'T-001', actorId:'U-001'})}); alert(response.ok ? '备份已创建' : '备份失败'); }
    async function showMachine(project) { const data = await (await fetch('/api/projects/' + project.id + '/machine-objects')).then(response => response.json()); el.innerHTML = `<h2>Machine Model / Machine DNA</h2><p class="muted">统一机器对象、设备、模块、Tag、Alarm、Recipe；实时值仍由 Edge Runtime 持有。</p><div class="panel"><table><thead><tr><th>ID</th><th>类型</th><th>名称</th><th>父对象</th><th>Owner</th><th>Revision</th></tr></thead><tbody>${data.objects.map(x => `<tr><td>${x.id}</td><td>${x.object_type}</td><td>${x.name}</td><td>${x.parent_id || '—'}</td><td>${x.owner_id}</td><td>${x.revision}</td></tr>`).join('')}</tbody></table></div>`; }
    async function showReadiness(project) { const data = await (await fetch('/api/projects/' + project.id + '/readiness')).then(response => response.json()); el.innerHTML = `<h2>实施就绪状态</h2><p class="muted">按依赖关系计算，不把 Placeholder 当作完成。</p><div class="panel"><table><thead><tr><th>工作包</th><th>状态</th><th>依赖是否满足</th><th>阻塞依赖</th></tr></thead><tbody>${data.items.map(x => `<tr><td>${x.id}</td><td>${x.status}</td><td class="${x.ready ? 'status' : 'placeholder'}">${x.ready ? '可开始' : '阻塞'}</td><td>${x.blockedBy.join(', ') || '—'}</td></tr>`).join('')}</tbody></table></div>`; }
    async function showCapabilities() { const data = await (await fetch('/api/engineering/capabilities')).then(response => response.json()); el.innerHTML = `<h2>工程能力与验证</h2><p class="muted">模拟验证可以提前发现问题；真实控制仍需人工批准。</p><div class="panel"><table><thead><tr><th>ID</th><th>能力</th><th>模式</th><th>检查项</th><th>安全门禁</th></tr></thead><tbody>${data.capabilities.map(x => `<tr><td>${x.id}</td><td>${x.name}</td><td>${x.mode}</td><td>${x.checks.join(' · ')}</td><td class="placeholder">${x.safetyGate}</td></tr>`).join('')}</tbody></table></div>`; }

    const baseAcceptance = showAcceptance; showAcceptance = async function(project) { await baseAcceptance(project); const report = await (await fetch('/api/projects/' + project.id + '/acceptance-report')).json(); el.innerHTML += `<div class="panel"><h3>工程能力证据覆盖</h3><table><thead><tr><th>能力</th><th>状态</th><th>验证证据</th></tr></thead><tbody>${(report.capabilityEvidence || []).map(x => `<tr><td>${x.capabilityId}</td><td class="${x.ready ? 'status' : 'warning'}">${x.ready ? '已覆盖' : '缺证据'}</td><td>${x.validatedEvidence.join('、') || '—'}</td></tr>`).join('')}</tbody></table></div>`; };
    const nav = document.getElementById('nav'); nav.insertAdjacentHTML('beforeend', '<button data-view="machine">Machine Model</button><button data-view="readiness">实施就绪</button><button data-view="capabilities">工程能力验证</button><button data-view="validation">验证执行台</button><button data-view="suite">全域验收套件</button><button data-view="toolchain">PLC/HMI 工具验证</button><button data-view="runtime">PLC Runtime 模拟</button><button data-view="artifacts">资产清单</button><button data-view="gate">Release Gate</button><button data-view="acceptance">一键验收报告</button><button data-view="ops">同步与通知</button><button data-view="team">团队与权限</button><button data-view="ai">AI 治理上下文</button><button data-view="test_plan">测试计划</button><button data-view="maintenance">维护记录</button>');
    const originalShowView = showView; showView = async function(view, project) { if (view === 'machine') return showMachine(project); if (view === 'readiness') return showReadiness(project); if (view === 'capabilities') return showCapabilities(); if (view === 'validation') return showValidationRunner(project); if (view === 'suite') return showSuite(project); if (view === 'toolchain') return showToolchain(project); if (view === 'runtime') return showRuntimeWithEvidence(project); if (view === 'artifacts') return showArtifacts(project); if (view === 'gate') return showGate(project); if (view === 'acceptance') return showAcceptance(project); if (view === 'ops') return showOps(project); if (view === 'team') return showTeam(project); if (view === 'ai') return showAIContext(project); return originalShowView(view, project); };
    async function renderRichOverview() { try { const projects = await (await fetch('/api/projects')).json(); if (!projects.projects.length) return; const project = projects.projects[0]; const [stats, backlog, capabilities, audit] = await Promise.all([fetch('/api/projects/' + project.id + '/stats').then(x => x.json()), fetch('/api/projects/' + project.id + '/backlog').then(x => x.json()), fetch('/api/engineering/capabilities').then(x => x.json()), fetch('/api/projects/' + project.id + '/audit').then(x => x.json())]); const items = backlog.items; const validated = items.filter(x => ['VALIDATED','RELEASED'].includes(x.status)).length; const blocked = items.filter(x => ['BLOCKED','FAILED'].includes(x.status)).length; const placeholders = items.filter(x => x.placeholder).length; const pct = items.length ? Math.round(validated / items.length * 100) : 0; el.innerHTML = `<div class="hero"><h2>${project.name}</h2><p>${project.id} · Engineering Control Center · 控制平面</p><div class="progress"><i style="width:${pct}%"></i></div><p style="margin-top:8px">总纲软件落地进度 ${pct}% · ${validated}/${items.length} 已验证 · ${blocked} 个阻塞</p></div><div class="cards"><div class="card"><label>总纲工作包</label><strong>${items.length}</strong><span class="muted">${placeholders} 个 Placeholder</span></div><div class="card"><label>管理对象</label><strong>${Object.values(stats.entities || {}).reduce((a,x) => a + Object.values(x).reduce((b,n) => b+n,0),0)}</strong><span class="muted">需求/测试/资产/发布</span></div><div class="card"><label>工程能力</label><strong>${capabilities.capabilities.length}</strong><span class="muted">模拟与契约验证</span></div><div class="card"><label>审计记录</label><strong>${audit.audit.length}</strong><span class="muted">全程可追溯</span></div></div><div class="grid"><div class="panel"><h3>实施状态</h3><table><thead><tr><th>状态</th><th>数量</th><th>说明</th></tr></thead><tbody>${['CONTRACTED','IMPLEMENTING','PLACEHOLDER','DEFERRED','VALIDATED'].map(s => `<tr><td>${s}</td><td>${items.filter(x => x.status === s).length}</td><td class="${s === 'PLACEHOLDER' || s === 'DEFERRED' ? 'warning' : 'muted'}">${s === 'PLACEHOLDER' ? '等待真实工程数据' : s === 'DEFERRED' ? '按路线延后' : '受控流程'}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>当前工程域</h3><table><thead><tr><th>能力</th><th>模式</th><th>安全门禁</th></tr></thead><tbody>${capabilities.capabilities.slice(0,6).map(x => `<tr><td>${x.id} ${x.name}</td><td>${x.mode}</td><td class="warning">人工审批</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h3>最近活动</h3><table><thead><tr><th>时间</th><th>动作</th><th>目标</th><th>结果</th></tr></thead><tbody>${audit.audit.slice(0,6).map(x => `<tr><td>${x.occurred_at}</td><td>${x.action}</td><td>${x.target_id}</td><td class="status">${x.outcome}</td></tr>`).join('')}</tbody></table></div>`; } catch (error) { console.error(error); } }
    load().then(renderRichOverview);
  </script>
</body>
</html>
