<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>织能工程控制中心</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#10151b; color:#e7edf4; }
    body { margin:0; } header { height:62px; display:flex; align-items:center; padding:0 28px; border-bottom:1px solid #2a3440; }
    header h1 { font-size:18px; margin:0; } header span { color:#8fa2b5; margin-left:14px; font-size:13px; }
    main { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 63px); } aside { border-right:1px solid #2a3440; padding:20px; }
    section { padding:28px 34px; max-width:1100px; } .tree { color:#b9c8d6; line-height:2; font-size:14px; }
    .tree .root { color:#fff; font-weight:700; } .tree .folder { margin-left:18px; } .tree .folder::before { content:'▸ '; color:#5fa8d3; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:24px 0; }
    .card { background:#19222c; border:1px solid #2b3946; border-radius:10px; padding:16px; } .card label { color:#8fa2b5; font-size:12px; }
    .card strong { display:block; font-size:26px; margin-top:8px; } .panel { background:#151d25; border:1px solid #2b3946; border-radius:10px; padding:18px; margin-top:18px; }
    table { width:100%; border-collapse:collapse; font-size:13px; } th,td { text-align:left; padding:11px 8px; border-bottom:1px solid #293540; } th { color:#8fa2b5; }
    .status { color:#71d7a4; } .muted { color:#8fa2b5; } .error { color:#ff8d8d; } .badge { border:1px solid #a87835; color:#f2c477; border-radius:12px; padding:3px 8px; font-size:11px; } .placeholder { color:#f2c477; }
    form { display:flex; gap:8px; flex-wrap:wrap; } input,select,button { background:#10151b; border:1px solid #405363; color:#e7edf4; border-radius:6px; padding:9px 10px; } button { background:#286c96; cursor:pointer; } button:hover { background:#368ab9; }
    nav { margin-top:24px; display:grid; gap:6px; } nav button { text-align:left; background:transparent; border-color:transparent; color:#b9c8d6; } nav button.active, nav button:hover { background:#1e3a4e; color:#fff; }
    .hero { background:linear-gradient(120deg,#173b50,#19222c); border:1px solid #3c7390; border-radius:14px; padding:24px; } .hero h2 { margin:0 0 8px; font-size:24px; } .hero p { margin:0; color:#b9c8d6; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; } .metric { color:#71d7a4; } .warning { color:#f2c477; } .progress { height:8px; background:#26333e; border-radius:5px; overflow:hidden; margin-top:10px; } .progress i { display:block; height:100%; background:#43b883; }
  </style>
</head>
<body>
  <header><h1>织能工程控制中心</h1><span>Project Control Center · PM-0</span><select id="project-selector" style="margin-left:auto;min-width:220px" hidden></select></header>
  <main><aside><div id="tree" class="tree"><div class="root">📁 当前项目</div><p class="muted">加载目录…</p></div><nav id="nav" hidden><button data-view="overview">总览</button><button data-view="backlog">实施路线</button><button data-view="requirement">需求</button><button data-view="work_item">任务</button><button data-view="issue">问题与 CAPA</button><button data-view="design_goal">设计目标</button><button data-view="test_case">测试库</button><button data-view="tool_validation">工具验证</button><button data-view="artifact">工程资产</button><button data-view="parameter_snapshot">参数快照</button><button data-view="knowledge">知识库</button><button data-view="release">发布维护</button><button data-view="audit">审计与备份</button></nav></aside>
    <section><div id="content"><p class="muted">正在加载项目…</p></div></section></main>
  <script>
    const el = document.getElementById('content'); let authSession = {actorId: 'U-001', tenantId: 'T-001'}; const nativeFetch = window.fetch.bind(window); window.fetch = (url, options = {}) => { const target = String(url); if (authSession && (target === '/api/projects' || target.startsWith('/api/projects/'))) { options = {...options, headers: {...(options.headers || {}), 'X-Actor-Id': authSession.actorId, 'X-Tenant-Id': authSession.tenantId}}; } return nativeFetch(url, options); };
    async function load() {
      try {
        const response = await fetch('/api/projects'); const data = await response.json();
        if (!data.projects.length) { el.innerHTML = `<h2>项目总览</h2><p class="muted">还没有项目，先创建 PM 项目。</p><div class="panel"><form id="project-form"><input name="projectId" placeholder="项目 ID，如 P-001" required><input name="name" placeholder="项目名称" required><input name="tenantId" placeholder="租户 ID" value="T-001" required><input name="ownerId" placeholder="Owner ID" value="U-001" required><button>创建项目</button></form><p id="form-message" class="muted"></p></div>`; document.getElementById('project-form').onsubmit = createProject; return; }
        const selectedId = window.selectedProjectId && data.projects.some(item => item.id === window.selectedProjectId) ? window.selectedProjectId : data.projects[0].id; const selectedSummary = data.projects.find(item => item.id === selectedId); authSession = {actorId: 'U-001', tenantId: selectedSummary.tenant_id}; const selector = document.getElementById('project-selector'); selector.innerHTML = data.projects.map(item => `<option value="${item.id}">${item.id} · ${item.name}</option>`).join(''); selector.value = selectedId; selector.hidden = false; selector.onchange = () => { window.selectedProjectId = selector.value; load().then(renderRichOverview); }; const project = await (await fetch('/api/projects/' + encodeURIComponent(selectedId))).json(); window.currentProject = project;
        const tree = await (await fetch('/api/projects/' + encodeURIComponent(project.id) + '/tree')).json();
        document.getElementById('tree').innerHTML = '<div class="root">📁 ' + project.name + '</div>' + renderTree(tree.tree);
        const entities = project.entities || []; const count = type => entities.filter(x => x.entity_type === type).length;
        el.innerHTML = `<h2>${project.name}</h2><p class="muted">${project.id} · ${project.kind} · revision ${project.revision}</p>
          <div class="cards"><div class="card"><label>需求</label><strong>${count('requirement')}</strong></div><div class="card"><label>任务</label><strong>${count('work_item')}</strong></div><div class="card"><label>问题</label><strong>${count('issue')}</strong></div><div class="card"><label>状态</label><strong class="status">${project.status}</strong></div></div>
          <div class="panel"><h3>新建对象</h3><form id="entity-form"><select name="type"><option value="requirement">需求</option><option value="work_item">任务</option><option value="issue">问题</option></select><input name="id" placeholder="对象 ID" required><input name="title" placeholder="标题" required><input name="ownerId" placeholder="Owner ID" value="U-001" required><button>创建</button></form><p id="form-message" class="muted"></p></div>
          <div class="panel"><h3>项目对象</h3><table><thead><tr><th>ID</th><th>类型</th><th>标题</th><th>状态</th><th>Revision</th><th>操作</th></tr></thead><tbody>${entities.map(x => `<tr><td>${x.id}</td><td>${x.entity_type}</td><td>${x.title}</td><td class="status">${x.status}</td><td>${x.revision}</td><td>${nextState(x) ? `<button data-id="${x.id}" data-revision="${x.revision}" data-target="${nextState(x)}" class="transition">→ ${nextState(x)}</button>` : '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
        document.getElementById('entity-form').onsubmit = event => createEntity(event, project);
        document.querySelectorAll('.transition').forEach(button => button.onclick = () => transition(button.dataset.id, button.dataset.target, Number(button.dataset.revision)));
        document.getElementById('nav').hidden = false; document.querySelectorAll('#nav button').forEach(button => button.onclick = () => showView(button.dataset.view, project));
      } catch (e) { el.innerHTML = `<p class="error">无法连接 PM 服务：${e.message}</p>`; }
    }
    function nextState(entity) { const map = { requirement:{DRAFT:'READY',READY:'IMPLEMENTING',IMPLEMENTING:'VERIFIED',VERIFIED:'ACCEPTED',ACCEPTED:'CLOSED'}, work_item:{PLANNED:'IN_PROGRESS',IN_PROGRESS:'REVIEW',REVIEW:'TEST',TEST:'DONE'}, issue:{OPEN:'REPRODUCED',REPRODUCED:'ROOT_CAUSED',ROOT_CAUSED:'FIXED',FIXED:'REGRESSION',REGRESSION:'CLOSED'}, design_goal:{DRAFT:'READY',READY:'IMPLEMENTING',IMPLEMENTING:'VERIFIED',VERIFIED:'ACCEPTED',ACCEPTED:'CLOSED'}, test_case:{DRAFT:'READY',READY:'RUNNING',RUNNING:'PASSED'}, test_plan:{DRAFT:'READY',READY:'RUNNING',RUNNING:'COMPLETED'}, test_run:{QUEUED:'RUNNING',RUNNING:'PASSED'}, evidence:{DRAFT:'VALIDATED',VALIDATED:'ARCHIVED'}, tool_validation:{DRAFT:'RUNNING',RUNNING:'VALIDATED'}, artifact:{DRAFT:'BUILT',BUILT:'TESTED',TESTED:'APPROVED'}, parameter_snapshot:{DRAFT:'VALIDATED',VALIDATED:'APPROVED',APPROVED:'APPLIED'}, knowledge:{DRAFT:'REVIEW',REVIEW:'VALIDATED',VALIDATED:'APPROVED'}, release:{DRAFT:'CANDIDATE',CANDIDATE:'VALIDATED',VALIDATED:'APPROVED',APPROVED:'RELEASED'}, maintenance:{OPEN:'IN_PROGRESS',IN_PROGRESS:'COMPLETED',COMPLETED:'CLOSED'}, deployment:{REQUESTED:'AUTHORIZED',AUTHORIZED:'STAGED',STAGED:'APPLIED',APPLIED:'OBSERVED',OBSERVED:'CONFIRMED'} }; return map[entity.entity_type]?.[entity.status]; }
    function renderTree(nodes, depth=0) { return nodes.map(node => '<div class="folder" style="margin-left:' + (depth*18+18) + 'px">' + node.name + '</div>' + renderTree(node.children || [], depth+1)).join(''); }
    async function showView(view, project) {
      document.querySelectorAll('#nav button').forEach(button => button.classList.toggle('active', button.dataset.view === view));
      if (view === 'overview') { load(); return; }
      if (view === 'traceability') { const graph = await (await fetch('/api/projects/' + project.id + '/traceability')).json(); el.innerHTML = `<h2>追溯图</h2><p class="muted">${graph.nodes.length} 个节点 · ${graph.edges.length} 条边 · Freshness：${graph.freshness}</p><div class="panel"><h3>对象关系</h3><table><thead><tr><th>From</th><th>关系</th><th>To</th><th>来源</th></tr></thead><tbody>${graph.edges.map(edge => `<tr><td>${edge.from}</td><td>${edge.type}</td><td>${edge.to}</td><td>${edge.source}</td></tr>`).join('') || '<tr><td colspan="4">暂无关系</td></tr>'}</tbody></table></div><div class="panel"><h3>未解析引用</h3><p class="${graph.unresolvedReferences.length ? 'warning' : 'status'}">${graph.unresolvedReferences.length ? graph.unresolvedReferences.map(item => `${item.from}.${item.field} → ${item.reference}`).join('；') : '全部引用已解析'}</p></div>`; return; }
      if (view === 'review') { const data = await (await fetch('/api/projects/' + project.id + '/entities?type=review')).json(); const next = {REQUESTED:'IN_REVIEW',IN_REVIEW:'APPROVED',CHANGES_REQUESTED:'IN_REVIEW',APPROVED:'SUPERSEDED'}; el.innerHTML = `<h2>评审与授权</h2><p class="muted">评审必须绑定 revision；APPROVED 需要具备审批权限的其他人员完成。</p><div class="panel"><h3>创建评审</h3><form id="review-form"><input name="id" placeholder="Review ID" required><input name="title" placeholder="评审标题" required><input name="reviewerId" placeholder="评审人 ID" required><input name="reviewedRevision" placeholder="被评审 Revision" required><select name="decision"><option value="PENDING">待评审</option><option value="APPROVED">通过</option><option value="CHANGES_REQUESTED">要求修改</option></select><input name="comments" placeholder="评审意见" required><button>保存评审</button></form><p id="review-message" class="muted"></p></div><div class="panel"><table><thead><tr><th>ID</th><th>标题</th><th>评审人</th><th>Revision</th><th>状态</th><th>操作</th></tr></thead><tbody>${data.entities.map(x => { const target = next[x.status]; return `<tr><td>${x.id}</td><td>${x.title}</td><td>${x.payload.reviewerId || '—'}</td><td>${x.payload.reviewedRevision || '—'}</td><td class="status">${x.status}</td><td>${target ? `<button class="transition" data-id="${x.id}" data-revision="${x.revision}" data-target="${target}">→ ${target}</button>` : '—'}</td></tr>`; }).join('') || '<tr><td colspan="6">暂无评审</td></tr>'}</tbody></table></div>`; document.getElementById('review-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/projects/' + project.id + '/entities', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:data.id,type:'review',title:data.title,ownerId:'U-001',tenantId:project.tenant_id,actorId:'U-001',payload:{reviewerId:data.reviewerId,reviewedRevision:Number(data.reviewedRevision),decision:data.decision,comments:data.comments}})}); document.getElementById('review-message').textContent = response.ok ? '评审已保存。' : '保存失败：' + ((await response.json()).message || '请求错误'); if (response.ok) showView('review', project); }; document.querySelectorAll('.transition').forEach(button => button.onclick = () => transition(button.dataset.id, button.dataset.target, Number(button.dataset.revision), () => showView('review', project))); return; }
      if (view === 'backlog') { const items = await (await fetch('/api/projects/' + project.id + '/backlog')).then(response => response.json()).then(data => data.items); const counts = items.reduce((a, x) => (a[x.status] = (a[x.status] || 0) + 1, a), {}); el.innerHTML = `<h2>总纲实施路线</h2><p class="muted">${project.name} · ${items.length} 个工作包 · 结构数据可先占位，真实实现和证据后续回填</p><div class="cards"><div class="card"><label>全部</label><strong>${items.length}</strong></div><div class="card"><label>已冻结契约</label><strong>${counts.CONTRACTED || 0}</strong></div><div class="card"><label>开发中</label><strong>${counts.IMPLEMENTING || 0}</strong></div><div class="card"><label>Placeholder</label><strong class="placeholder">${items.filter(x => x.placeholder).length}</strong></div></div><div class="panel"><h3>工作包与验收门禁</h3><table><thead><tr><th>ID</th><th>领域</th><th>工作包</th><th>状态</th><th>目标版本</th><th>验收标准</th><th>依赖</th></tr></thead><tbody>${items.map(x => `<tr><td>${x.id}</td><td>${x.area}</td><td>${x.title}</td><td>${x.placeholder ? '<span class="badge">PLACEHOLDER</span>' : '<span class="status">' + x.status + '</span>'}</td><td>${x.target_release}</td><td>${x.acceptance_criteria.join('；')}</td><td>${x.dependencies.join(', ') || '—'}</td></tr>`).join('')}</tbody></table></div>`; return; }
      if (view === 'audit') { const data = await (await fetch('/api/projects/' + project.id + '/audit')).json(); el.innerHTML = `<h2>审计与备份</h2><p class="muted">所有关键变更保留操作人、目标、结果和时间。</p><div class="panel"><button onclick="backupProject('${project.id}')">创建并校验项目备份</button><p id="backup-message" class="muted"></p></div><div class="panel"><table><thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>目标</th><th>结果</th></tr></thead><tbody>${data.audit.map(x => `<tr><td>${x.occurred_at}</td><td>${x.actor_id}</td><td>${x.action}</td><td>${x.target_id}</td><td class="status">${x.outcome}</td></tr>`).join('')}</tbody></table></div>`; return; }
      const entities = await (await fetch('/api/projects/' + project.id + '/entities?type=' + view)).then(response => response.json()).then(data => data.entities);
      const labels = {requirement:'需求', work_item:'开发任务', issue:'问题与 CAPA', design_goal:'设计目标', test_case:'测试库', test_plan:'测试计划', tool_validation:'PLC/HMI/工具验证', artifact:'工程资产与固件', parameter_snapshot:'参数快照与同步', knowledge:'知识库', release:'发布与维护', maintenance:'维护记录', deployment:'部署请求', machine_commit:'Machine Commit'};
      el.innerHTML = `<h2>${labels[view]}</h2><p class="muted">${project.name} · ${entities.length} 项</p><div class="panel"><h3>新建${labels[view]}</h3><form id="view-form"><input name="id" placeholder="对象 ID" required><input name="title" placeholder="标题" required><input name="ownerId" placeholder="Owner ID" value="U-001" required><button>创建</button></form><p id="form-message" class="muted"></p></div><div class="panel"><table><thead><tr><th>ID</th><th>标题</th><th>状态</th><th>Revision</th><th>操作</th></tr></thead><tbody>${entities.map(x => `<tr><td>${x.id}</td><td>${x.title}</td><td class="status">${x.status}</td><td>${x.revision}</td><td>${nextState(x) ? `<button class="transition" data-id="${x.id}" data-revision="${x.revision}" data-target="${nextState(x)}">→ ${nextState(x)}</button>` : '—'}</td></tr>`).join('')}</tbody></table></div>`;
      document.getElementById('view-form').onsubmit = event => createEntity(event, project, view);
      if (view === 'test_case') { el.innerHTML += `<div class="panel"><h3>录入测试用例</h3><form id="test-case-create-form"><input name="id" placeholder="测试用例 ID" required><input name="title" placeholder="标题" required><textarea name="payload" rows="6" style="width:100%;font-family:monospace">{"steps":["run"],"inputs":{"mode":"smoke"},"expected":{"result":"pass"},"thresholds":{"maxMs":100}}</textarea><button>保存测试用例</button></form><p id="test-case-create-message" class="muted">执行前必须具备步骤、输入、预期结果和阈值。</p></div>`; document.getElementById('test-case-create-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); let payload; try { payload = JSON.parse(data.payload); } catch (_) { document.getElementById('test-case-create-message').textContent = 'JSON 格式错误'; return; } const response = await fetch('/api/projects/' + project.id + '/entities', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:data.id,type:'test_case',title:data.title,ownerId:'U-001',tenantId:project.tenant_id,actorId:'U-001',payload})}); document.getElementById('test-case-create-message').textContent = response.ok ? '测试用例已保存。' : '保存失败'; if (response.ok) showView('test_case', project); }; if (entities.length) { el.innerHTML += `<div class="panel"><h3>执行测试并生成证据</h3><form id="test-run-form"><select name="testCaseId">${entities.map(x => `<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select><input name="runId" placeholder="Test Run ID" required><input name="evidenceId" placeholder="Evidence ID" required><input name="releaseId" placeholder="Release ID（可选）"><select name="passed"><option value="true">通过</option><option value="false">失败</option></select><button>执行测试</button></form><p id="test-run-message" class="muted"></p></div>`; document.getElementById('test-run-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/projects/' + project.id + '/test-runs/execute', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:project.tenant_id,actorId:'U-001',testCaseId:data.testCaseId,runId:data.runId,evidenceId:data.evidenceId,releaseId:data.releaseId || undefined,passed:data.passed === 'true'})}); const result = await response.json(); document.getElementById('test-run-message').textContent = response.ok ? `Test Run：${result.testRun.status}；Evidence：${result.evidence ? result.evidence.status : '未生成（失败）'}` : '执行失败：' + (result.message || result.error || '请求错误'); }; } }
      if (view === 'test_plan') { const cases = await (await fetch('/api/projects/' + project.id + '/entities?type=test_case')).json().then(data => data.entities); el.innerHTML += `<div class="panel"><h3>创建测试计划</h3><form id="test-plan-create-form"><input name="id" placeholder="计划 ID" required><input name="title" placeholder="计划标题" required><input name="testCaseIds" placeholder="测试用例 ID，逗号分隔" required><button>保存计划</button></form><p id="test-plan-create-message" class="muted">可用用例：${cases.map(x => x.id).join('、') || '暂无'}</p></div>`; document.getElementById('test-plan-create-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/projects/' + project.id + '/entities', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:data.id,type:'test_plan',title:data.title,ownerId:'U-001',tenantId:project.tenant_id,actorId:'U-001',payload:{testCaseIds:data.testCaseIds.split(',').map(x => x.trim()).filter(Boolean)}})}); document.getElementById('test-plan-create-message').textContent = response.ok ? '测试计划已保存。' : '保存失败：' + ((await response.json()).message || '请求错误'); if (response.ok) showView('test_plan', project); }; if (entities.length) { el.innerHTML += `<div class="panel"><h3>批量执行测试计划</h3><form id="test-plan-run-form"><select name="testPlanId">${entities.map(x => `<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select><input name="runPrefix" placeholder="Run 前缀" required><input name="evidencePrefix" placeholder="Evidence 前缀" required><textarea name="passedByCase" rows="3" style="width:100%;font-family:monospace">{}</textarea><button>执行计划</button></form><p id="test-plan-run-message" class="muted">passedByCase 可用 JSON 指定失败用例，例如 {"TC-002":false}。</p></div>`; document.getElementById('test-plan-run-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); let passedByCase; try { passedByCase = JSON.parse(data.passedByCase); } catch (_) { document.getElementById('test-plan-run-message').textContent = 'passedByCase JSON 格式错误'; return; } const response = await fetch('/api/projects/' + project.id + '/test-plans/execute', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenantId:project.tenant_id,actorId:'U-001',testPlanId:data.testPlanId,runPrefix:data.runPrefix,evidencePrefix:data.evidencePrefix,passedByCase})}); const result = await response.json(); document.getElementById('test-plan-run-message').textContent = response.ok ? `计划：${result.testPlan.status}；通过 ${result.summary.passed}/${result.summary.total}` : '执行失败：' + (result.message || result.error || '请求错误'); if (response.ok) showView('test_plan', project); }; } }

    async function showValidationRunner(project) { const caps = await (await fetch('/api/engineering/capabilities')).json(); el.innerHTML = `<h2>工程验证执行台</h2><p class="muted">选择能力并提交 JSON 检查项，自动产生 Test Run 与 Evidence；失败结果也会保留，供问题和 CAPA 追踪。</p><div class="panel"><form id="validation-form"><select name="capabilityId">${caps.capabilities.map(x => `<option value="${x.id}">${x.id} · ${x.name}</option>`).join('')}</select><input name="testRunId" placeholder="Test Run ID" required><input name="evidenceId" placeholder="Evidence ID" required><textarea name="payload" rows="7" style="width:100%;font-family:monospace" placeholder='{"tag_binding":true,"alarm_binding":true,"screen_smoke":true}'>{"source_present":true,"toolchain_pinned":true,"deterministic_build":true}</textarea><button>执行验证并留证</button></form><p id="validation-message" class="muted"></p></div><div id="validation-result"></div>`; document.getElementById('validation-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); let payload; try { payload = JSON.parse(data.payload); } catch (_) { document.getElementById('validation-message').textContent = 'JSON 格式错误'; return; } const response = await fetch('/api/projects/' + project.id + '/simulate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({actorId:'U-001',tenantId:project.tenant_id,capabilityId:data.capabilityId,testRunId:data.testRunId,evidenceId:data.evidenceId,payload})}); const result = await response.json(); document.getElementById('validation-message').textContent = response.ok ? '验证记录已写入项目。' : '验证失败：' + (result.message || result.error || '请求错误'); if (response.ok) document.getElementById('validation-result').innerHTML = `<div class="panel"><h3 class="${result.validation.result === 'PASSED' || result.validation.result === 'CONTRACT_PASSED' ? 'status' : 'warning'}">${result.validation.result}</h3><p>Test Run：${result.testRun.status} · Evidence：${result.evidence.statu     async function showAIContext(project) { const entities = await (await fetch('/api/projects/' + project.id + '/entities')).then(response => response.json()); const ids = entities.entities.slice(0, 20).map(x => x.id).join(','); el.innerHTML = `<h2>AI 治理上下文</h2><p class="muted">仅提供当前项目、数量受限且通过可信状态门禁的对象；AI 只能读取、评论、建议，不能审批、发布、部署或 Force。</p><div class="panel"><form id="ai-form"><textarea name="objectIds" rows="4" style="width:100%;font-family:monospace">${ids}</textarea><button>生成最小上下文</button></form><p id="ai-message" class="muted"></p></div><div id="ai-result"></div>`; document.getElementById('ai-form').onsubmit = async event => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/ai/context', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({projectId:project.id,actorId:'AI-001',objectIds:data.objectIds.split(',').map(x => x.trim()).filter(Boolean)})}); const result = await response.json(); document.getElementById('ai-message').textContent = response.ok ? '上下文已按治理策略生成。' : '生成失败：' + (result.message || result.error || '请求错误'); if (response.ok) document.getElementById('ai-result').innerHTML = `<div class="panel"><h3>允许动作</h3><p class="status">${result.allowedActions.join(' · ')}</p><h3>拒绝动作</h3><p class="warning">${result.deniedActions.join(' · ')}</p><p class="muted">纳入对象：${result.objects.map(x => x.id).join('、') || '无'}</p><p class="warning">过滤对象：${result.omitted?.map(x => x.id + '（' + x.reason + '）').join('、') || '无'}</p></div>`; }; }
    async function showSuite(project) { const payloads = {"PLC-001":{source_present:true,toolchain_pinned:true,deterministic_build:true},"PLC-002":{cycle_time:true,watchdog:true,safe_stop:true},"HMI-001":{tag_binding:true,alarm_binding:true,screen_smoke:true,tag_ids:["Start","Stop"],bound_tag_ids:["Start","Stop"]},"EDA-001":{io_consistency:true,bom_consistency:true,io_expected:["DI-1","DO-1"],io_actual:["DI-1","DO-1"]},"MOT-001":{axis_simulation:true,limit_check:true,state_machine:true,soft_limit_min:-100,soft_limit_max:100},"VIS-001":{dataset_hash:true,thresholds:true,regression_set:true,threshold_values:[0.5,0.8]},"ROB-001":{handshake:true,permission_scope:true,fault_recovery:true,handshake_sequence:["INIT","READY","START","DONE"]},"FW-001":{binary_hash:"sha256:demo",power_recovery:true,rollback:true},"EDGE-001":{offline_queue:true,replay_idempotency:true,conflict:true},"COMM-001":{checklist:true,evidence:true,signoff:true,checklist_items:[{id:"FAT-1",passed:true}]},"LIFE-001":{production_metrics:true,quality_metrics:true,maintenance_workflow:true,metric_values:[0,1,100],spc_values:[10,11,10],spc_lower:9,spc_upper:12,health_signals:{temperature:50},health_limits:{temperature:{min:0,max:80}}},"ECO-001":{consent:true,scope:true,retention:true}}; const runKey = Date.now(); el.innerHTML = `<h2>全域软件验收套件</h2><p class="muted">按总规划对 12 个工程能力执行默认确定性验证，结果自动留证。真实设备接入前使用样例；接入后替换输入即可回归。</p><div class="panel"><button id="suite-run">运行 12 项验证</button><p id="suite-message" class="muted"></p></div><div class="panel"><table><thead><tr><th>能力</th><th>Test Run</th><th>Evidence</th><th>结果</th><th>诊断/缺项</th></tr></thead><tbody id="suite-results"></tbody></table></div>`; document.getElementById('suite-run').onclick = async () => { const button = document.getElementById('suite-run'); button.disabled = true; const rows = document.getElementById('suite-results'); let passed = 0; for (const [capabilityId, payload] of Object.entries(payloads)) { const testRunId = `SUITE-${runKey}-${capabilit     async function showToolchain(project) { const cases = [{id:'PLC-GOLDEN',toolchain:'PLC-SIM-1',compilePassed:true,hmiSmoke:true,expectedHash:'golden-plc',actualHash:'golden-plc'},{id:'HMI-GOLDEN',toolchain:'HMI-SIM-1',compilePassed:true,hmiSmoke:true,expectedHash:'golden-hmi',actualHash:'golden-hmi'}]; el.innerHTML = `<h2>PLC/HMI 工具验证</h2><p class="muted">运行 Golden Project 矩阵，校验工具链、编译、HMI Smoke 和 Hash，并保存为项目验证记录。</p><div class="panel"><button id="toolchain-run">运行工具验证矩阵</button><p id="toolchain-message" class="muted"></p></div><div id="toolchain-result"></div>`; document.getElementById('toolchain-run').onclick = async () => { const stamp = Date.now(); const response = await fetch('/api/projects/' + project.id + '/toolchain-matrix', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({actorId:'U-001',tenantId:project.tenant_id,validationId:'TV-UI-' + stamp,cases})}); const result = await response.json(); document.getElementById('toolchain-message').textContent = response.ok ? '矩阵结果已保存到项目。' : '验证失败：' + (result.message || result.error || '请求错误'); if (response.ok) document.getElementById('toolchain-result').innerHTML = `<div class="panel"><h3 class="${result.matrix.result === 'PASSED' ? 'status' : 'warning'}">${result.matrix.result}</h3><p>Tool Validation：${result.validation.status} · ${result.matrix.passed}/${result.matrix.total} 通过</p><p class="muted">matrixHash：${result.matrix.matrixHash}</p></div>`; }; }

        const targets = (entitiesData.entities || []).filter(item => !['ai_suggestion', 'release', 'deployment', 'artifact', 'machine_commit', 'parameter_snapshot'].includes(item.entity_type));
        const validEvidence = (entitiesData.entities || []).filter(item => item.entity_type === 'evidence' && item.status === 'VALIDATED');
        el.innerHTML = `<h2>AI 受控工程协作</h2><p class="muted">Read → Suggest → Diff → Test → Apply。Apply 必须绑定同项目 VALIDATED Evidence、Owner 人工审批和目标 Revision，且不能作用于发布、部署、资产或控制对象。</p><div class="grid"><div class="panel"><h3>生成建议</h3><form id="governed-ai-suggest"><input name="id" placeholder="Suggestion ID" required><input name="request" placeholder="例如：补充需求验收说明" required><input name="objectIds" placeholder="上下文对象 ID，逗号分隔"><button>生成建议</button></form><p id="governed-ai-message" class="muted"></p></div><div class="panel"><h3>人工 Apply</h3><form id="governed-ai-apply"><select name="suggestionId">${suggestions.filter(item => !item.payload.applied).map(item => `<option value="${item.id}">${item.id} · ${item.payload.request || item.title}</option>`).join('') || '<option value="">暂无未应用建议</option>'}</select><select name="targetEntityId">${targets.map(item => `<option value="${item.id}" data-revision="${item.revision}">${item.id} · ${item.entity_type} · r${item.revision}</option>`).join('') || '<option value="">暂无可应用对象</option>'}</select><select name="testEvidenceId">${validEvidence.map(item => `<option value="${item.id}">${item.id} · ${item.title}</option>`).join('') || '<option value="">暂无 VALIDATED Evidence</option>'}</select><input name="approvalId" placeholder="Owner 审批 ID" required><textarea name="patch" rows="5" style="width:100%;font-family:monospace" placeholder='{"description":"更新后的内容"}' required>{"description":"人工确认后的建议变更"}</textarea><button>提交 Apply</button></form><p id="governed-ai-apply-message" class="muted"></p></div></div><div class="panel"><h3>建议记录</h3><table><thead><tr><th>ID</th><th>请求</th><th>Applied</th><th>Hash</th></tr></thead><tbody>${suggestions.map(item => `<tr><td>${item.id}</td><td>${item.payload.request || '—'}</td><td>${item.payload.applied ? '是' : '否'}</td><td>${item.payload.suggestionHash || '—'}</td></tr>`).join('') || '<tr><td colspan="4">暂无建议</td></tr>'}</tbody></table></div>`;
        document.getElementById('governed-ai-suggest').onsubmit = async event => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/projects/' + project.id + '/ai/suggest', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({suggestionId:values.id,request:values.request,objectIds:values.objectIds ? values.objectIds.split(',').map(item => item.trim()).filter(Boolean) : [],actorId:'U-001',tenantId:project.tenant_id})}); const result = await response.json(); document.getElementById('governed-ai-message').textContent = response.ok ? '建议已保存，必须先测试再 Apply。' : '生成失败：' + (result.message || result.error || '请求错误'); if (response.ok) showGovernedAI(project); };
        document.getElementById('governed-ai-apply').onsubmit = async event => { event.preventDefault(); const form = event.target; const values = Object.fromEntries(new FormData(form)); let patch; try { patch = JSON.parse(values.patch); } catch (_) { document.getElementById('governed-ai-apply-message').textContent = 'Patch JSON 格式错误'; return; } const target = form.elements.targetEntityId.selectedOptions[0]; const response = await fetch('/api/projects/' + project.id + '/ai/apply', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({suggestionId:values.suggestionId,targetEntityId:values.targetEntityId,targetExpectedRevision:Number(target?.dataset.revision || 0),patch,approvalId:values.approvalId,testEvidenceId:values.testEvidenceId,actorId:'U-001',tenantId:project.tenant_id})}); const result = await response.json(); document.getElementById('governed-ai-apply-message').textContent = response.ok ? `Apply 完成：${result.target.id} revision ${result.target.revision}` : 'Apply 被拒绝：' + (result.message || result.error || '请求错误'); if (response.ok) showGovernedAI(project); };
      }
    })();
  </script>
  <script>
    (() => {
      const priorShowView = window.showView;
      window.showView = async function(view, project) { if (view === 'ops') return showOpsWithSync(project); return priorShowView(view, project); };
      async function showOpsWithSync(project) {
        await priorShowView('ops', project);
        const result = await (await fetch('/api/projects/' + project.id + '/sync-summary')).json();
        const checks = result.checks || {};
        el.insertAdjacentHTML('afterbegin', `<div class="panel"><h3>Edge 离线同步重放安全摘要</h3><div class="cards"><div class="card"><label>可安全重放</label><strong class="${result.readyForReplay ? 'status' : 'warning'}">${result.readyForReplay ? 'READY' : 'BLOCKED'}</strong></div><div class="card"><label>队列 / 已应用</label><strong>${result.statusCounts?.QUEUED || 0} / ${result.statusCounts?.APPLIED || 0}</strong></div><div class="card"><label>冲突 / 失败</label><strong class="${result.statusCounts?.CONFLICT || result.statusCounts?.FAILED ? 'warning' : 'status'}">${result.statusCounts?.CONFLICT || 0} / ${result.statusCounts?.FAILED || 0}</strong></div></div><p>幂等键：${checks.idempotency ? '通过' : '失败'} · PUSH 审批：${checks.pushApprovals ? '通过' : '失败'} · 冲突：${checks.noConflicts ? '无' : result.conflictIds.join('、')} · 失败：${checks.noFailures ? '无' : result.failedIds.join('、')}</p></div><div class="panel"><h3>人工冲突裁决</h3><form id="sync-resolution-form"><input name="syncId" placeholder="Sync ID" required><select name="target"><option value="QUEUED">裁决后重新排队</option><option value="FAILED">确认失败并关闭重放</option></select><input name="reason" placeholder="裁决理由（必填）" required><button>提交裁决</button></form><p id="sync-resolution-message" class="muted">所有裁决会写入 Audit 和 Event Outbox。</p></div>`);
        document.getElementById('sync-resolution-form').onsubmit = async event => { event.preventDefault(); const values = Object.fromEntries(new FormData(event.target)); const response = await fetch('/api/sync/' + encodeURIComponent(values.syncId) + '/transition', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target:values.target,reason:values.reason,tenantId:project.tenant_id,actorId:'U-001'})}); const body = await response.json(); document.getElementById('sync-resolution-message').textContent = response.ok ? `裁决完成：${body.id} → ${body.status}` : '裁决失败：' + (body.message || body.error || '请求错误'); if (response.ok) showOpsWithSync(project); };
      }
    })();
  </script>
  <script>
    (() => {
      const priorShowView = window.showView;
      window.showView = async function(view, project) { if (view === 'deployment') return showDeploymentWithPreflight(project); return priorShowView(view, project); };
      async function showDeploymentWithPreflight(project) {
        await priorShowView('deployment', project);
        const data = await (await fetch('/api/projects/' + project.id + '/entities?type=deployment')).json();
        const deployments = data.entities || [];
        el.insertAdjacentHTML('afterbegin', `<div class="panel"><h3>Deployment Preflight</h3><p class="muted">按状态机分阶段检查：授权 → 暂存 → 观察；只读，不执行现场部署。</p><select id="deployment-preflight-id">${deployments.map(item => `<option value="${item.id}">${item.id} · ${item.status}</option>`).join('') || '<option value="">暂无部署请求</option>'}</select><button id="deployment-preflight-run" ${deployments.length ? '' : 'disabled'}>运行预检</button><p id="deployment-preflight-message" class="muted"></p><div id="deployment-preflight-result"></div></div>`);
        const run = async () => { const id = document.getElementById('deployment-preflight-id').value; if (!id) return; const response = await fetch('/api/projects/' + project.id + '/deployment-preflight?deploymentId=' + encodeURIComponent(id)); const result = await response.json(); document.getElementById('deployment-preflight-message').textContent = response.ok ? '预检完成' : '预检失败：' + (result.message || result.error || '请求错误'); if (response.ok) document.getElementById('deployment-preflight-result').innerHTML = `<p>授权：<strong class="${result.readyForAuthorization ? 'status' : 'warning'}">${result.readyForAuthorization ? 'READY' : 'BLOCKED'}</strong> · 暂存：<strong class="${result.readyForStaging ? 'status' : 'warning'}">${result.readyForStaging ? 'READY' : 'BLOCKED'}</strong> · 观察：<strong class="${result.readyForObservation ? 'status' : 'warning'}">${result.readyForObservation ? 'READY' : 'BLOCKED'}</strong></p><p>缺失：${(result.missing || []).join('、') || '无'}</p>`; };
        document.getElementById('deployment-preflight-run').onclick = run;
        document.getElementById('deployment-preflight-id').onchange = run;
        if (deployments.length) await run();
      }
    })();
  </script>
  <script>
    (() => {
      const priorShowSuite = window.showSuite;
      window.showSuite = async function(project) {
        await priorShowSuite(project);
        el.innerHTML = el.innerHTML.replaceAll('12 个工程能力', '14 个工程能力').replaceAll('运行 12 项验证', '运行 12 项基础验证');
        el.insertAdjacentHTML('beforeend', `<div class="panel"><h3>新增边界验证</h3><p class="muted">DRV-001 驱动认证矩阵与 SAFE-001 软件安全边界证据单独运行，不接触真实硬件。</p><button id="run-boundary-suite">运行 DRV-001 / SAFE-001</button><p id="boundary-suite-message" class="muted"></p></div>`);
        document.getElementById('run-boundary-suite').onclick = async event => {
          event.target.disabled = true;
          const cases = [{id:'DRV-GOLDEN',protocol:'EtherCAT',connect_passed:true,readback_passed:true,fault_recovery:true,expected_hash:'h1',actual_hash:'h1'}];
          const payloads = { 'DRV-001': {protocol:'EtherCAT',connect_passed:true,readback_passed:true,fault_recovery:true,cases}, 'SAFE-001': {realtime_isolation:true,controller_write_false:true,human_approval:true,fault_safe:true} };
          const results = [];
          for (const [capabilityId, payload] of Object.entries(payloads)) {
            const response = await fetch('/api/projects/' + project.id + '/simulate', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actorId:'U-001',tenantId:project.tenant_id,capabilityId,testRunId:'BOUNDARY-' + Date.now() + '-' + capabilityId + '-RUN',evidenceId:'BOUNDARY-' + Date.now() + '-' + capabilityId + '-EVIDENCE',payload})});
            const body = await response.json(); results.push(capabilityId + ': ' + (body.validation?.result || body.message || 'ERROR'));
          }
          document.getElementById('boundary-suite-message').textContent = results.join(' · ') + '；结果已留证。'; event.target.disabled = false;
        };
      };
    })();
  </script>
  <script>
    (() => {
      const priorShowView = window.showView;
      window.showView = async function(view, project) {
        if (view !== 'acceptance') return priorShowView(view, project);
        await priorShowView(view, project);
        const audit = await (await fetch('/api/projects/' + project.id + '/completion-audit')).json();
        const checks = Object.entries(audit.checks || {}).map(([name, passed]) => `<tr><td>${name}</td><td class="${passed ? 'status' : 'warning'}">${passed ? 'PASS' : 'BLOCKED'}</td></tr>`).join('');
        el.insertAdjacentHTML('beforeend', `<div class="panel"><h3>总纲完成度审计</h3><p class="${audit.ready ? 'status' : 'warning'}">${audit.ready ? '软件范围门禁全部满足' : '仍有明确阻塞项，不能宣称完成'}</p><p>能力证据：${audit.softwareScope.validated}/${audit.softwareScope.total} · 硬件/正式认证延后：${audit.hardwareDeferred.join('、') || '无'}</p><table><thead><tr><th>门禁</th><th>结果</th></tr></thead><tbody>${checks}</tbody></table><p class="muted">阻塞项：${audit.blockers.length ? audit.blockers.map(item => item.id + '：' + item.reason).join('；') : '无'}</p></div>`);
      };
    })();
  </script>
  <script>
    (() => {
      const priorShowView = window.showView;
      window.showView = async function(view, project) {
        if (view !== 'issue') return priorShowView(view, project);
        await priorShowView(view, project);
        const data = await (await fetch('/api/projects/' + project.id + '/entities?type=issue')).json();
        const rows = [];
        for (const issue of (data.entities || []).slice(0, 30)) {
          const preflight = await (await fetch('/api/projects/' + project.id + '/issue-preflight?issueId=' + encodeURIComponent(issue.id))).json();
          rows.push(`<tr><td>${issue.id}</td><td class="${preflight.readyForClosure ? 'status' : 'warning'}">${preflight.readyForClosure ? 'READY' : 'BLOCKED'}</td><td>${(preflight.missing || []).join('、') || '全部满足'}</td></tr>`);
        }
        el.insertAdjacentHTML('beforeend', `<div class="panel"><h3>问题/CAPA 关闭预检</h3><p class="muted">关闭前必须完成根因、修复版本、回归测试、关闭标准和同项目 VALIDATED Evidence。</p><table><thead><tr><th>Issue</th><th>结论</th><th>缺项</th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="3">暂无问题</td></tr>'}</tbody></table></div>`);
      };
    })();
  </script>
</body>
